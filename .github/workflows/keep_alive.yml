name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 3 days at 08:00 UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # Replace with your actual Streamlit Cloud app URL
          URL="https://dashboardfires.streamlit.app"
          echo "Pinging $URL to prevent hibernation..."
          curl -sL -o /dev/null -w "%{http_code}\n" "$URL"

